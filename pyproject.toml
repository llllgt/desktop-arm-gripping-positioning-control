[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop_arm"
version = "0.1.0"
description = "Desktop workpiece transfer: mechanical design, trajectory generation and ROS 2/MuJoCo control"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.12", "mujoco>=3.3", "matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
cad = ["cadquery>=2.5", "trimesh>=4"]
test = ["pytest>=8"]

[project.scripts]
desktop-arm = "desktop_arm.cli:main"
desktop-arm-ros = "desktop_arm.ros_nodes:main"

[tool.setuptools.packages.find]
include = ["desktop_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
